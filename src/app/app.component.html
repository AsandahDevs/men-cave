<nav class="navbar navbar-expand-lg navbar-light bg-light" [ngClass]="currentRoute === '/login' || currentRoute === '' ? 'hideNavBar':'showNavBar'">
    <div class="container-fluid">
      <a class="navbar-brand" routerLink="/home"><img [src]="navigation?.logoUrl || imageURL" width='65px' height='45px' [alt]="navigation?.logoAlt || 'Men Cave logo'"></a>
      <button
        class="navbar-toggler"
        type="button"
        (click)="inlineNav.toggle()"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <i class="fas fa-bars"></i>
      </button>
      <div
        class="collapse navbar-collapse"
        id="navbarText"
        mdbCollapse
        #inlineNav="mdbCollapse"
      >
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li *ngFor="let link of navigation?.links" class="nav-item">
            <a *ngIf="!link.external" class="nav-link" routerLinkActive="active" [routerLink]="link.url">{{ link.label }}</a>
            <a *ngIf="link.external" class="nav-link" [href]="link.url" target="_blank" rel="noopener noreferrer">{{ link.label }}</a>
          </li>
          <li *ngIf="!navigation" class="nav-item"><a class="nav-link active" routerLink="/home">Home</a></li>
          <li *ngIf="!navigation" class="nav-item"><a class="nav-link" routerLink="/products">Products</a></li>
        </ul>
        <span class="nav-item cart-nav-item">
          <a
            class="cart-link"
            [routerLink]="['shopping-cart']"
            [attr.aria-label]="totalCartProducts() + ' items in your shopping bag'"
            title="Shopping bag"
          >
            <i class="fas fa-bag-shopping" aria-hidden="true"></i>
            <span *ngIf="totalCartProducts()" class="cart-count">{{ totalCartProducts() }}</span>
          </a>
        </span>
      </div>
    </div>
  </nav>
<router-outlet></router-outlet>
