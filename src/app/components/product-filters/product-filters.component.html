<section class="product-filters" aria-label="Product filters">
  <label class="search-box" for="product-search">
    <i class="fas fa-search" aria-hidden="true"></i>
    <input
      id="product-search"
      type="search"
      [value]="searchTerm"
      (input)="updateSearch($event)"
      placeholder="Search the collection"
      autocomplete="off"
    />
  </label>

  <div class="category-list" aria-label="Product categories">
    <button
      type="button"
      class="category-chip"
      [class.is-selected]="selectedCategory === 'All products'"
      (click)="selectCategory('All products')"
    >
      All products
    </button>
    <button
      *ngFor="let category of categories"
      type="button"
      class="category-chip"
      [class.is-selected]="selectedCategory === category"
      (click)="selectCategory(category)"
    >
      {{ category }}
    </button>
  </div>

  <label class="sort-control" for="product-sort">
    <span>Sort by</span>
    <select id="product-sort" [value]="selectedSort" (change)="selectSort($event)">
      <option value="name:asc">Name: A–Z</option>
      <option value="name:desc">Name: Z–A</option>
      <option value="price:asc">Price: low to high</option>
      <option value="price:desc">Price: high to low</option>
    </select>
  </label>
</section>
