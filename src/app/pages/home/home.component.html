<main class="home-page">
  <section class="hero">
    <div class="hero-content">
      <p class="eyebrow">{{ homePage?.brandTitle }}</p>
      <h1>{{ homePage?.headline }}</h1>
      <p class="hero-copy">{{ homePage?.description }}</p>
      <div *ngIf="homePage?.ctaLabel && homePage?.ctaUrl" class="hero-actions">
        <a [href]="homePage?.ctaUrl" class="primary-cta">{{ homePage?.ctaLabel }} <i class="fas fa-arrow-right" aria-hidden="true"></i></a>
      </div>
    </div>
    <div class="hero-image" [class.is-empty]="!homePage?.heroMedia">
      <img *ngIf="homePage?.heroMedia" [src]="homePage?.heroMedia?.url" [alt]="homePage?.heroMedia?.alt" />
      <div class="hero-image-overlay"></div>
    </div>
  </section>

  <section *ngFor="let section of homePage?.sections; trackBy: trackBySection" class="content-section" [class.announcements-section]="section.media.length">
    <div class="section-heading">
      <div>
        <h2>{{ section.title }}</h2>
        <p *ngFor="let paragraph of section.paragraphs" class="section-copy">{{ paragraph }}</p>
        <a *ngIf="section.link" [href]="section.link.url" class="primary-cta section-cta">{{ section.link.label }} <i class="fas fa-arrow-right" aria-hidden="true"></i></a>
      </div>
    </div>
    <div *ngIf="section.media.length" class="announcements-grid">
      <img *ngFor="let image of section.media; trackBy: trackByImageUrl" [src]="image.url" [alt]="image.alt" />
    </div>
  </section>
</main>
<app-footer [lines]="homePage?.footerLines ?? []"></app-footer>
